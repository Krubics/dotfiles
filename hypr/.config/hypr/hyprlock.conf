general {
    ignore_empty_input = true
}

auth  {
     pam:enabled = false
}

background {
    path = /usr/share/wallpapers/current.jpg
    blur_passes = 3       # more passes = smoother/stronger blur, costs more GPU
    blur_size = 8         # blur radius per pass
    noise = 0.0117   
    contrast = 0.8916  
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

image {
    monitor =
    path = /home/krubics/.config/hypr/images/sleeping-snorlax.png
    size = 300              # px, scaled proportionally
    border_size = 0
    rounding = 0
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    font_family = JetBrainsMono Nerd Font
    font_size = 90
    position = 0, 300
    halign = center
    valign = center
}
